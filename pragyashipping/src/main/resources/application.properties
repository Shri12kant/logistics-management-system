spring.application.name=pragyashipping
spring.datasource.url=jdbc:mysql://localhost:3306/pragya_shipping

spring.datasource.username=root

# Set DB_PASSWORD in environment / .env for production
spring.datasource.password=${DB_PASSWORD:AMan@#$9450}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false

# JWT — override JWT_SECRET_KEY in production (min 32 chars)
app.jwt.secret=${JWT_SECRET_KEY:PragyaShippingSecretKeyForJWTAuthentication2026Secure}

# Comma-separated frontend origins for CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Razorpay — leave empty until keys are added. Test keys from dashboard.razorpay.com
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
