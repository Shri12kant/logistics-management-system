version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: pragya_shipping
    volumes:
      - db-data:/var/lib/mysql
      - ./pragyashipping/create_admin.sql:/docker-entrypoint-initdb.d/create_admin.sql:ro
    ports:
      - "3306:3306"

  backend:
    build:
      context: ./pragyashipping
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/pragya_shipping
      - SPRING_DATASOURCE_USERNAME=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./pragya-shipping
    environment:
      - VITE_API_URL=http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
